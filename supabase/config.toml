
[functions.create-checkout]
enabled = true
verify_jwt = false
import_map = "./functions/create-checkout/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-checkout/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-checkout/*.html" ]

[functions.payment-redirect]
enabled = true
verify_jwt = false
import_map = "./functions/payment-redirect/deno.json"
entrypoint = "./functions/payment-redirect/index.ts"

[functions.delete-account]
enabled = true
verify_jwt = true
entrypoint = "./functions/delete-account/index.ts"

[functions.stripe-webhook]
enabled = true
verify_jwt = false
# Verifies Stripe signature manually via STRIPE_WEBHOOK_SECRET.
entrypoint = "./functions/stripe-webhook/index.ts"

[functions.cancel-party-session]
enabled = true
verify_jwt = false
# Verifies party member_token manually in-function.
entrypoint = "./functions/cancel-party-session/index.ts"

[functions.party-lock]
enabled = true
verify_jwt = false
# Host-only; validates party member_token and quotes Stripe Tax before locking.
import_map = "./functions/party-lock/deno.json"
entrypoint = "./functions/party-lock/index.ts"

[functions.quote-cart-tax]
enabled = true
verify_jwt = false
# Used by the app for cart tax estimates; shared logic with party-lock.
entrypoint = "./functions/quote-cart-tax/index.ts"

[functions.party-reap]
enabled = true
verify_jwt = false
# Scheduled sweeper; verifies x-reap-secret header or service-role bearer.
entrypoint = "./functions/party-reap/index.ts"
